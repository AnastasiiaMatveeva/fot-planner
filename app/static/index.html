<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Планирование ФОТ — CML-Bench 2.0</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="brandbar">
  <img src="/logo.svg" alt="CML-Bench 2.0" class="logo">
  <span class="bname">Сервис планирования фонда оплаты труда</span>
  <span class="spacer"></span>
  <!-- Справа — режим работы и переключатель контекстной колонки: то, что
       относится ко всему сервису, а не к текущему плану. -->
  <span class="mode" id="mode"></span>
  <button type="button" class="iconbtn" id="toggleside" title="Скрыть колонку контекста"
          aria-label="Скрыть колонку контекста">
    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
         stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="12" height="10" rx="1.6"/>
      <path d="M10.5 3v10"/>
    </svg>
  </button>
</header>

<div class="shell">

  <!-- Навигация: разделы с иконками, ниже список планов, внизу главное
       действие и аккаунт. Иконка означает «это раздел», ее отсутствие —
       «это запись». -->
  <aside class="cases">
    <nav class="nav">
      <button type="button" class="navi" id="openreg">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4.2c0-.7.6-1.2 1.2-1.2h2.4c.4 0 .8.2 1 .5l.7 1h5.5c.7 0 1.2.5 1.2 1.2v6.1c0 .7-.5 1.2-1.2 1.2H3.2c-.6 0-1.2-.5-1.2-1.2z"/>
          </svg>
        </span>
        Реестр организации
      </button>
      <button type="button" class="navi" id="openagents">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5.5" width="10" height="7.5" rx="1.6"/>
            <path d="M8 3v2.5M5.8 9h.01M10.2 9h.01"/>
          </svg>
        </span>
        Ход работы
      </button>
    </nav>

    <div class="ctitle">Планы</div>
    <div id="caselist" class="clist"></div>

    <button type="button" class="cta" id="newcase">+&nbsp;&nbsp;Новый план</button>
  </aside>

  <!-- лента плана -->
  <main class="chat">
    <!-- Заголовок объекта: название, состояние и главное действие
         принадлежат плану, а не ленте. Лента — только один из его видов,
         поэтому вкладки идут ниже заголовка. -->
    <header class="phead">
      <div class="row">
        <h1 id="ptitle"></h1>
        <button id="solve" class="primary" type="button">Рассчитать план</button>
      </div>
      <div class="meta" id="pmeta"></div>
    </header>

    <!-- Лента — основной режим; остальные вкладки нужны, чтобы открыть и
         посмотреть данные, которые агенты собрали, и результат расчета. -->
    <nav class="tabs" id="tabs">
      <button type="button" class="tab on" data-view="feed">Лента</button>
      <button type="button" class="tab" data-view="plan">План выплат</button>
      <button type="button" class="tab" data-view="cash">Освоение</button>
      <button type="button" class="tab" data-view="lim">Ограничения</button>
    </nav>

    <div class="feed" id="feed"></div>
    <div class="view" id="view" hidden></div>
    <div class="view" id="regview" hidden></div>
    <div class="view" id="agentview" hidden></div>

    <div class="ask" id="ask" hidden></div>


    <form class="composer" id="composer">
      <label class="attach" title="Загрузить документы">
        <input type="file" id="files" multiple accept=".xlsx,.xlsm,.xls,.pdf,.doc,.docx" hidden>
        <span>+</span>
      </label>
      <input type="text" id="text" placeholder="Ответьте агенту или напишите, что поправить"
             autocomplete="off">
      <button type="submit" id="send">Отправить</button>
    </form>
  </main>

  <!-- кто сейчас работает -->
  <aside class="side">
    <section>
      <h3>Агенты</h3>
      <div id="agents" class="agents"></div>
    </section>

    <section>
      <h3>Документы</h3>
      <div id="docs" class="docs"></div>
      <button type="button" class="ghost" id="toreg">Весь реестр организации</button>
    </section>

    <section>
      <h3>Расчет</h3>
      <div id="runs" class="runs"></div>
    </section>
  </aside>

</div>

<script src="/app.js"></script>
</body>
</html>
