<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Планирование ФОТ — CML-Bench 2.0</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="brandbar">
  <img src="/logo.svg" alt="CML-Bench 2.0" class="logo">
  <span class="bname">Сервис планирования фонда оплаты труда</span>
</header>

<div class="shell">

  <!-- планы: точка возврата -->
  <aside class="cases">
    <!-- Реестр организации отделен от планов: документы, договоры, штатка и
         нормативы служат всем планам сразу, а план — это год планирования. -->
    <div class="ctitle">Организация</div>
    <button type="button" class="reg" id="openreg">Реестр документов и данных</button>

    <div class="ctitle">Планы</div>
    <div id="caselist" class="clist"></div>
    <button type="button" class="cta" id="newcase">+&nbsp;&nbsp;Новый план</button>
  </aside>

  <!-- лента плана -->
  <main class="chat">
    <div class="stage" id="stage"></div>

    <!-- Лента — основной режим; остальные вкладки нужны, чтобы открыть и
         посмотреть данные, которые агенты собрали, и результат расчета. -->
    <nav class="tabs" id="tabs">
      <button type="button" class="tab on" data-view="feed">Лента</button>
      <button type="button" class="tab" data-view="plan">План выплат</button>
      <button type="button" class="tab" data-view="cash">Освоение</button>
      <button type="button" class="tab" data-view="lim">Ограничения</button>
    </nav>

    <div class="feed" id="feed"></div>
    <div class="view" id="view" hidden></div>
    <div class="view" id="regview" hidden></div>

    <div class="ask" id="ask" hidden></div>

    <!-- Расчет — главное действие плана, поэтому кнопка стоит над строкой
         ввода: там взгляд и так находится, прокрутки не требует и ничего
         не выдавливает из строки. -->
    <div class="act">
      <span class="hint" id="solvehint"></span>
      <button id="solve" class="primary" type="button">Рассчитать план</button>
    </div>

    <form class="composer" id="composer">
      <label class="attach" title="Загрузить документы">
        <input type="file" id="files" multiple accept=".xlsx,.xlsm,.xls,.pdf,.doc,.docx,.csv" hidden>
        <span>+</span>
      </label>
      <input type="text" id="text" placeholder="Ответьте агенту или напишите, что поправить"
             autocomplete="off">
      <button type="submit" id="send">Отправить</button>
    </form>
  </main>

  <!-- кто сейчас работает -->
  <aside class="side">
    <section>
      <h3>Агенты</h3>
      <div id="agents" class="agents"></div>
    </section>

    <section>
      <h3>Документы</h3>
      <div id="docs" class="docs"></div>
      <button type="button" class="ghost" id="toreg">Весь реестр организации</button>
    </section>

    <section>
      <h3>Расчет</h3>
      <div id="runs" class="runs"></div>
    </section>
  </aside>

</div>

<script src="/app.js"></script>
</body>
</html>
