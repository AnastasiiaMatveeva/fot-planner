<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CML · Планирование ФОТ</title>
</head>
<body>
<style>
  :root{
    --paper:#E7EDF5;--card:#FFF;--c2:#F4F7FC;--c3:#E8EFF7;--c4:#DCE6F1;
    --ink:#0D2036;--ink2:#33506C;--ink3:#6A829B;
    --ln:#BED1E3;--ln2:#DBE6F1;
    --br:#1565C0;--br2:#0E4E96;--brbg:#E4F0FC;
    --ai:#6A3FBF;--aibg:#F2EBFD;
    --sv:#0B7A78;--svbg:#DEF2F1;
    --mn:#A66A00;--mnbg:#FCF1DB;
    --bd:#C0392B;--bdbg:#FBEAE8;--ok:#12784C;
    --tg:#0F4C82;--tr:#6A3FBF;--tv:#0B7A78;--tz:#A66A00;
    --k1:#0F4C82;--k2:#2E86C1;--k3:#6EAEDC;--k4:#A9CFEC;--k5:#C98A00;--k6:#C0392B;
    --f:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    --m:Consolas,"SF Mono",ui-monospace,monospace;
  }
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html{background:#E7EDF5 !important;min-height:100%}
  body{margin:0 !important;min-height:100vh;background:#E7EDF5 !important;color:var(--ink) !important;
       font-family:var(--f);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1560px;margin:0 auto;padding:clamp(6px,1vw,12px) clamp(6px,1vw,14px) 14px}
  .app{background:var(--card);border:1px solid var(--ln);border-radius:6px;overflow:hidden;
       box-shadow:0 2px 4px rgba(13,32,54,.08),0 22px 50px -32px rgba(13,32,54,.6)}
  button{font:inherit;border-radius:4px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--br);outline-offset:1px}

  .bar{display:flex;align-items:center;gap:13px;padding:8px 14px;border-bottom:2px solid var(--ln);background:var(--card)}
  .bar .mk{width:27px;height:27px;border-radius:4px;background:var(--br);color:#FFF;font-family:var(--m);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
  .bar .wm{font-size:15.5px;font-weight:700}
  .bar .wm em{font-style:normal;color:var(--ink3);font-weight:400}
  .bar .sc{font-family:var(--m);font-size:12px;color:var(--ink3);border-left:1px solid var(--ln);padding-left:13px}
  .bar .sp{flex:1 1 auto}
  .run{font-size:14.5px;font-weight:700;line-height:1;padding:10px 18px;border:2px solid var(--br);background:var(--br);color:#FFF;flex:none}
  .run:hover{background:var(--br2);border-color:var(--br2)}
  .run.busy{background:var(--c3);border-color:var(--ln);color:var(--ink3);cursor:default}

  .body{display:grid;grid-template-columns:250px minmax(0,1fr)}
  .nav{border-right:2px solid var(--ln);background:var(--c2);display:flex;flex-direction:column;padding-bottom:6px}
  .nav .g{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:12px 13px 5px}
  .nv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 13px;border:0;border-radius:0;
      background:transparent;border-left:4px solid transparent;color:var(--ink2);font-size:13.5px}
  .nv:hover{background:var(--c3);color:var(--ink)}
  .nv.on{background:var(--card);color:var(--ink);font-weight:700;border-left-color:var(--z,var(--br))}
  .nv i{width:8px;height:8px;border-radius:50%;background:var(--z,var(--ink3));flex:none}
  .nv .c{margin-left:auto;font-family:var(--m);font-size:11.5px;color:var(--ink3);font-weight:400}
  .nv .bdg{margin-left:auto;font-family:var(--m);font-size:11px;font-weight:700;color:#FFF;background:var(--mn);border-radius:9px;padding:1px 7px}

  .cont{min-width:0;display:flex;flex-direction:column}
  .ch{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--ln2);background:var(--c2)}
  .ch h2{margin:0;font-size:17px;font-weight:700}
  .ch .sub{font-family:var(--m);font-size:12px;color:var(--ink3)}
  .ch .sp{flex:1 1 auto}
  .cb{padding:13px 16px;display:flex;flex-direction:column;gap:12px;min-height:420px}

  .ttl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
  .scr{overflow:auto;max-height:396px;border:1px solid var(--ln)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--ln2);white-space:nowrap}
  thead th{position:sticky;top:0;background:var(--c3);font-family:var(--m);font-size:10.5px;text-transform:uppercase;
           letter-spacing:.04em;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--ln);z-index:1}
  td.n{text-align:right;font-family:var(--m);font-variant-numeric:tabular-nums}
  td.mono{font-family:var(--m)}
  tbody tr:hover td{background:var(--c2)}
  tbody tr.sel td{background:var(--brbg)}
  tbody tr[data-k]{cursor:pointer}
  .y{color:var(--ok);font-weight:700}.no{color:var(--ink3);opacity:.6}
  .pill{display:inline-block;font-family:var(--m);font-size:10.5px;font-weight:700;letter-spacing:.03em;
        border:1.5px solid var(--c);color:var(--c);border-radius:3px;padding:0 6px}

  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:2px;background:var(--ln);border:1px solid var(--ln)}
  .kpi>div{background:var(--c2);padding:8px 11px;display:flex;flex-direction:column;gap:0}
  .kpi .n{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
  .kpi .v{font-family:var(--m);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .s{font-family:var(--m);font-size:10.5px;color:var(--ink3)}
  .kpi .v.a{color:var(--sv)}.kpi .v.m{color:var(--ink3)}.kpi .v.w{color:var(--mn)}

  .split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
  .side{border:1px solid var(--ln);border-radius:4px;background:var(--c2);padding:11px 13px;display:flex;flex-direction:column;gap:9px;align-self:start}
  .side .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .side .h .cd{font-family:var(--m);font-size:15px;font-weight:700;color:var(--c)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
  .kv dt{color:var(--ink3)}
  .kv dd{margin:0;font-family:var(--m);font-variant-numeric:tabular-nums;text-align:right}
  .allow{display:flex;flex-wrap:wrap;gap:4px}
  .ak{font-family:var(--m);font-size:11px;padding:1px 6px;border-radius:3px;border:1.5px solid var(--ln2);color:var(--ink3)}
  .ak.y{border-color:var(--ok);color:var(--ok);font-weight:700}
  .ak.n{opacity:.5;text-decoration:line-through}
  .spark{display:flex;align-items:flex-end;gap:2px;height:34px}
  .spark i{flex:1 1 0;background:var(--c);border-radius:1px 1px 0 0;min-height:2px}
  .sx{display:flex;gap:2px;font-family:var(--m);font-size:9px;color:var(--ink3)}
  .sx span{flex:1 1 0;text-align:center}

  /* chart */
  .cg{display:grid;grid-template-columns:54px minmax(0,1fr)}
  .yx{position:relative;height:206px}
  .yx span{position:absolute;right:8px;transform:translateY(50%);font-family:var(--m);font-size:11px;color:var(--ink3)}
  .yx .u{top:-4px;transform:none;font-size:10px}
  .pl{position:relative;display:flex;align-items:flex-end;gap:5px;height:206px}
  .tk{position:absolute;left:0;right:0;border-top:1px solid var(--ln2)}
  .mb{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:transparent;
      border:0;border-radius:0;padding:0;min-width:0;transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
  .mb.gr{transform:scaleY(1)}
  .mb span{display:block;background:var(--c)}
  .mb.sel{box-shadow:inset 0 0 0 3px var(--ink2)}
  .xx{display:flex;gap:5px;padding-top:5px}
  .xx span{flex:1 1 0;text-align:center;font-family:var(--m);font-size:11px;color:var(--ink3)}
  .lgd{display:flex;flex-wrap:wrap;gap:5px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:12px;font-weight:700;color:var(--ink2);
      border:1.5px solid var(--ln2);border-radius:4px;padding:2px 8px;background:var(--card)}
  .lg i{width:11px;height:11px;border-radius:2px;background:var(--c);flex:none}
  .ro{border:1.5px solid var(--ln2);border-radius:4px;background:var(--c2);padding:7px 11px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:38px}
  .ro .mo{font-size:14px;font-weight:700}
  .ro .sg{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:12px;color:var(--ink2);
          background:var(--card);border:1.5px solid var(--ln2);border-radius:4px;padding:1px 7px}
  .ro .sg i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
  .ro .hint{font-size:13px;color:var(--ink3)}

  /* agents */
  .agent{border:2px solid var(--ai);border-radius:5px;background:var(--aibg);padding:11px 13px;display:flex;flex-direction:column;gap:9px}
  .agent .hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .agent .tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ai);
              border:2px solid var(--ai);border-radius:4px;padding:3px 8px;background:var(--card)}
  .agent .st{font-family:var(--m);font-size:12px;color:var(--ink2)}
  .agent input{font:inherit;font-size:14px;flex:1 1 300px;min-width:0;padding:8px 11px;border:2px solid var(--ln);border-radius:4px;background:var(--card);color:var(--ink)}
  .agent input:focus-visible{outline:none;border-color:var(--ai)}
  .agent .go2{font-size:13.5px;font-weight:700;padding:9px 14px;border:2px solid var(--ai);background:var(--ai);color:#FFF;flex:none}
  .ex{display:flex;gap:5px;flex-wrap:wrap}
  .ex button{font-size:12px;padding:4px 9px;border:1px solid var(--ln);background:var(--card);color:var(--ink2)}
  .ex button:hover{border-color:var(--ai);color:var(--ai)}

  .ask{border:2px solid var(--mn);border-left-width:5px;border-radius:5px;background:var(--mnbg);padding:10px 13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ask .tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mn);border:2px solid var(--mn);border-radius:4px;padding:3px 8px;background:var(--card);flex:none}
  .ask .q{font-size:13.5px;color:var(--ink2);flex:1 1 280px}
  .ask .q b{color:var(--ink);font-family:var(--m);font-size:13px}
  .ask button{font-size:13px;font-weight:700;padding:7px 12px;border:2px solid var(--mn);background:var(--card);color:var(--mn)}
  .ask button:hover{background:var(--mn);color:#FFF}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .pch{font-family:var(--m);font-size:12px;border:1.5px solid var(--ln2);border-radius:4px;padding:2px 8px;background:var(--card);color:var(--ink2)}
  .pch.hot{border-color:var(--ai);color:var(--ai);font-weight:700}
  .pch b{color:var(--ink)}

  .diag{border:2px solid var(--bd);border-left-width:5px;border-radius:6px;background:var(--bdbg);
        padding:14px 16px;display:flex;flex-direction:column;gap:9px;max-width:760px}
  .diag .tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--bd);
             border:2px solid var(--bd);border-radius:4px;padding:3px 8px;background:var(--card);align-self:flex-start}
  .diag h3{margin:0;font-size:16px;font-weight:700;color:var(--bd)}
  .diag p{margin:0;font-size:14px;color:var(--ink2)}
  .conf{background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:9px 12px;
        display:flex;flex-direction:column;gap:4px}
  .conf .cl{display:flex;gap:9px;align-items:baseline;font-size:13px;color:var(--ink2)}
  .conf .cl b{font-family:var(--m);font-size:12.5px;color:var(--ink);flex:none;min-width:132px}
  .fix{display:flex;flex-direction:column;gap:6px}
  .fixb{text-align:left;font-size:14px;font-weight:700;padding:10px 14px;border-radius:4px;
        border:2px solid var(--sv);background:var(--card);color:var(--sv)}
  .fixb:hover{background:var(--sv);color:#FFF}
  .fixb small{display:block;font-size:11.5px;font-weight:400;opacity:.85;margin-top:1px}
  .fixb.on{background:var(--sv);color:#FFF}

  .memo{border:2px solid var(--ai);border-left-width:5px;border-radius:6px;background:var(--card);
        padding:16px 18px;display:flex;flex-direction:column;gap:11px;max-width:820px}
  .memo .tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ai)}
  .memo h3{margin:0;font-size:16px;font-weight:700}
  .memo ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
  .memo li{font-size:14px;color:var(--ink2)}
  .memo b{font-family:var(--m);font-size:13px;color:var(--ink)}
  .memo .q{border-left:3px solid var(--ln);padding:4px 0 4px 13px;font-size:13.5px;color:var(--ink2);font-style:italic}
  .memo .cp{align-self:flex-start;font-size:13px;font-weight:700;padding:8px 14px;border:2px solid var(--br);
            background:var(--card);color:var(--br)}
  .memo .cp:hover{background:var(--br);color:#FFF}

  .scn{display:flex;flex-wrap:wrap;gap:6px}
  .scn button{font-size:12.5px;padding:5px 11px;border:1.5px solid var(--ln);background:var(--card);color:var(--ink2)}
  .scn button:hover{border-color:var(--ai);color:var(--ai)}
  .scn button.on{border-color:var(--ai);background:var(--aibg);color:var(--ai);font-weight:700}
  .delta{font-family:var(--m);font-weight:700}
  .delta.up{color:var(--bd)}.delta.dn{color:var(--sv)}.delta.z{color:var(--ink3)}

  .rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:6px}
  .rc{border:1.5px solid var(--ln2);border-left:4px solid var(--sv);border-radius:4px;background:var(--card);padding:7px 10px;display:flex;flex-direction:column}
  .rc .n{font-size:12.5px;font-weight:600}
  .rc .s{font-family:var(--m);font-size:11px;color:var(--ink3)}

  .ru{border:1.5px solid var(--ln2);border-radius:4px;background:var(--card);overflow:hidden;margin-bottom:5px}
  .ru>button{width:100%;text-align:left;font-size:13.5px;font-weight:700;padding:8px 12px;border:0;border-radius:0;background:var(--c2);color:var(--ink);display:flex;gap:9px}
  .ru>button:hover{background:var(--c3)}
  .ru .mk2{font-family:var(--m);color:var(--br)}
  .ru .bd{display:none;padding:9px 13px;font-size:13px;color:var(--ink2)}
  .ru.op .bd{display:block}
  .ru .bd ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:4px}
  .ru .bd code{font-family:var(--m);font-size:12px;background:var(--c2);border:1px solid var(--ln2);border-radius:3px;padding:0 5px;color:var(--ink)}

  .pstat{display:flex;align-items:center;gap:8px 6px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
  .pstat b{font-family:var(--m);font-size:15px}
  .pstat .gap{width:8px}
  .pd{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}

  .qwrap{max-width:660px;display:flex;flex-direction:column;gap:8px}
  .qnum{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mn)}
  .qcard{border:2px solid var(--mn);border-radius:6px;background:var(--card);overflow:hidden;
         box-shadow:0 8px 26px -16px rgba(166,106,0,.6)}
  .qsrc{background:var(--mnbg);padding:10px 14px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--ln)}
  .qsrc .w{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mn)}
  .qsrc .f{font-family:var(--m);font-size:12px;color:var(--ink2)}
  .vraw{font-family:var(--m);font-size:14px;background:#FFF6D6;border:1.5px solid #D8AE1F;border-radius:3px;
        padding:3px 9px;display:inline-block;align-self:flex-start}
  .qbody{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .qbody .fld{font-size:12.5px;color:var(--ink3)}
  .qbody .got{font-size:15px;font-weight:700}
  .qbody .why{font-size:13.5px;color:var(--ink2);border-left:3px solid var(--mn);padding:2px 0 2px 10px}
  .qbtns{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
  .qbtn{font-size:14px;font-weight:700;padding:10px 16px;border-radius:4px;border:2px solid var(--ai);
        background:var(--ai);color:#FFF;text-align:left}
  .qbtn:hover{filter:brightness(1.1)}
  .qbtn small{display:block;font-size:10.5px;font-weight:400;letter-spacing:.03em;opacity:.85;margin-top:1px}
  .qbtn.alt{background:var(--card);color:var(--ink2);border-color:var(--ln)}
  .qbtn.alt:hover{border-color:var(--ai);color:var(--ai);filter:none}
  .qbtn.alt small{opacity:.7}

  .drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:36px 20px;width:100%;
        border:2px dashed var(--br);border-radius:8px;background:var(--brbg);color:var(--ink2);cursor:pointer}
  .drop:hover{background:#DCEAFA}
  .drop .di{font-size:32px;color:var(--br);line-height:1}
  .drop .dt{font-size:16px;font-weight:700;color:var(--ink)}
  .drop .ds{font-family:var(--m);font-size:12px;color:var(--ink3)}
  .drop .ds2{font-size:13px;color:var(--ink2);max-width:52ch;text-align:center}

  .steps{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .stp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
  .stp b{width:21px;height:21px;border-radius:50%;background:var(--c3);color:var(--ink2);
         display:grid;place-items:center;font-size:11px;font-family:var(--m);flex:none}

  .dstat{font-family:var(--m);font-size:11.5px;font-weight:700;white-space:nowrap}
  .dstat.w{color:var(--ink3)}.dstat.k{color:var(--ok)}.dstat.u{color:var(--mn)}
  .fixtype{font-size:11.5px;font-weight:700;padding:3px 8px;border:1.5px solid var(--mn);
           background:var(--card);color:var(--mn);margin-left:7px}
  .fixtype:hover{background:var(--mn);color:#FFF}

  .done{border:2px solid var(--ok);border-radius:6px;background:#EAF6EF;padding:13px 16px;
        display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:660px}
  .done .t{font-size:15px;font-weight:700;color:var(--ok)}
  .done .s{font-size:13px;color:var(--ink2)}
  .done button{font-size:14px;font-weight:700;padding:10px 16px;border:2px solid var(--br);
               background:var(--br);color:#FFF;margin-left:auto}
  .done button:hover{background:var(--br2)}

  details.jrnl{border:1px solid var(--ln2);border-radius:4px;background:var(--c2)}
  details.jrnl>summary{cursor:pointer;padding:9px 13px;font-size:13px;color:var(--ink2);font-weight:600;
                       list-style:none;display:flex;align-items:center;gap:8px}
  details.jrnl>summary::-webkit-details-marker{display:none}
  details.jrnl>summary::before{content:"\25B8";font-family:var(--m);color:var(--ink3)}
  details.jrnl[open]>summary::before{content:"\25BE"}
  details.jrnl .in{padding:0 10px 10px}

  .bars{height:7px;background:var(--ln2);border-radius:4px;overflow:hidden;min-width:80px}
  .bars b{display:block;height:100%;background:var(--c);width:0;transition:width .7s ease}
  .okb{display:inline-flex;font-family:var(--m);font-size:11px;font-weight:700;color:var(--ok);border:1.5px solid var(--ok);border-radius:3px;padding:0 6px}

  .sbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 14px;border-top:2px solid var(--ln);
        background:var(--c2);font-family:var(--m);font-size:11.5px;color:var(--ink3)}
  .sbar .s1{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
  .sbar .s1 i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
  .sbar .s1.ok{color:var(--ok)}.sbar .s1.ok i{background:var(--ok)}
  .sbar .sp{flex:1 1 auto}
