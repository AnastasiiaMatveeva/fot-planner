<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Планирование ФОТ — CML</title>
</head>
<body>
<style>
  /* Деловой светлый стиль. Разделение пространством и фоном, не рамками.
     Без точек-разделителей, без цветных полос, без бордюрных бейджей. */
  :root{
    --paper:#E9EEF4; --s0:#FFFFFF; --s1:#F4F7FA; --s2:#EBF0F5;
    --ink:#152638; --ink2:#3D5165; --ink3:#5C6C7C;
    --line:#D4DCE4; --line2:#E4E9EF;
    --acc:#175FA9; --acc2:#0F4C8C; --accbg:#EAF2FA;
    --ok:#207A4E; --warn:#9A6A00; --bad:#B3392B; --badbg:#F9ECEA;
    --agent:#6D5BA8;
    --k-okl:#134E85; --k-120:#B8860B; --k-122:#3579B8; --k-124:#7FA8CC;
    --k-152:#B7CBDD; --k-prk:#B3392B;
    --f:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    --m:Consolas,"Cascadia Mono",ui-monospace,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{background:#E9EEF4 !important;min-height:100%}
  body{margin:0 !important;min-height:100vh;background:#E9EEF4 !important;color:var(--ink) !important;
       font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1480px;margin:0 auto;padding:clamp(6px,1vw,14px)}
  .app{background:var(--s0);border:1px solid var(--line);border-radius:3px;overflow:hidden;
       box-shadow:0 1px 3px rgba(21,38,56,.10)}
  button{font:inherit;cursor:pointer;border-radius:2px}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

  /* ── верхняя панель ─────────────────────────────── */
  .top{display:flex;align-items:center;gap:16px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--s0)}
  .logo{display:flex;align-items:baseline;gap:8px}
  .logo b{font-size:15px;font-weight:700}
  .logo span{font-size:13px;color:var(--ink3)}
  .top .sp{flex:1}
  .runbtn{font-size:14px;font-weight:600;padding:9px 20px;border:1px solid var(--acc2);
          background:var(--acc);color:#FFF}
  .runbtn:hover{background:var(--acc2)}
  .runbtn[disabled]{background:var(--s2);border-color:var(--line);color:var(--ink3);cursor:default}
  .srcnote{font-size:12px;color:var(--ink3)}

  /* ── каркас ─────────────────────────────────────── */
  .frame{display:grid;grid-template-columns:236px minmax(0,1fr)}
  .nav{border-right:1px solid var(--line);background:var(--s1);padding:2px 0 8px}
  .nav .g{font-size:11px;font-weight:600;color:var(--ink3);padding:13px 14px 4px;text-transform:uppercase;letter-spacing:.03em}
  .nv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;
      padding:6px 14px;color:var(--ink2);font-size:13.5px;border-radius:0}
  .nv:hover{background:var(--s2);color:var(--ink)}
  .nv.on{background:var(--accbg);color:var(--acc2);font-weight:600}
  .nv i{width:7px;height:7px;border-radius:50%;background:var(--z,transparent);flex:none}
  .nv .c{margin-left:auto;font:12px var(--m);color:var(--ink3);font-weight:400}
  .nv .warnc{margin-left:auto;font:600 12px var(--m);color:var(--warn)}

  .main{min-width:0;display:flex;flex-direction:column}
  .head{padding:12px 18px 10px;border-bottom:1px solid var(--line2)}
  .head h1{margin:0;font-size:17px;font-weight:700}
  .head p{margin:2px 0 0;font-size:12.5px;color:var(--ink3)}
  .body{padding:14px 18px 20px;display:flex;flex-direction:column;gap:14px}

  .status{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;padding:6px 16px;
          border-top:1px solid var(--line);background:var(--s1);font:12px var(--m);color:var(--ink3)}
  .status .st{color:var(--ink2)}
  .status .st.ok{color:var(--ok);font-weight:600}
  .status .sp{flex:1}

  /* ── типовые блоки ──────────────────────────────── */
  .cap{font-size:11.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
  .note{font-size:12.5px;color:var(--ink3)}
  .plain{font-size:13.5px;color:var(--ink2);max-width:88ch}
  .plain b{color:var(--ink)}

  .scr{overflow:auto;max-height:430px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
  thead th{position:sticky;top:0;z-index:1;background:var(--s2);font-size:12px;font-weight:600;
           color:var(--ink2);border-bottom:1px solid var(--line)}
  td.n,th.n{text-align:right;font-family:var(--m);font-variant-numeric:tabular-nums}
  td.mono{font-family:var(--m);font-size:12.5px}
  tbody tr:hover td{background:var(--s1)}
  tbody tr.sel td{background:var(--accbg)}
  tbody tr[data-k]{cursor:pointer}
  tbody tr.total td{background:var(--s1);font-weight:700;border-top:1px solid var(--line)}
  .tOK{color:var(--ok);font-weight:600}
  .tWARN{color:var(--warn);font-weight:600}
  .tBAD{color:var(--bad);font-weight:600}
  .tMUTE{color:var(--ink3)}

  .kpi{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);background:var(--s0)}
  .kpi>div{flex:1 1 150px;padding:9px 14px;border-right:1px solid var(--line2)}
  .kpi>div:last-child{border-right:0}
  .kpi .k{font-size:11.5px;color:var(--ink3)}
  .kpi .v{font:700 19px/1.25 var(--m);font-variant-numeric:tabular-nums}
  .kpi .v.ok{color:var(--ok)} .kpi .v.mute{color:var(--ink3)} .kpi .v.warn{color:var(--warn)}
  .kpi .s{font-size:11.5px;color:var(--ink3)}

  .split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
  .split>div{min-width:0}
  .scr{max-width:100%}
  .side{background:var(--s1);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .side h3{margin:0;font-size:14.5px;font-weight:700}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
  .kv dt{color:var(--ink3)}
  .kv dd{margin:0;font-family:var(--m);font-variant-numeric:tabular-nums;text-align:right}
  .kv dd.txt{font-family:var(--f)}

  /* ── диаграмма ──────────────────────────────────── */
  .chart{display:grid;grid-template-columns:52px minmax(0,1fr)}
  .yax{position:relative;height:220px}
  .yax span{position:absolute;right:8px;transform:translateY(50%);font:11.5px var(--m);color:var(--ink3)}
  .yax .u{top:-3px;transform:none;font-size:10.5px}
  .plot{position:relative;display:flex;align-items:flex-end;gap:6px;height:220px}
  .gline{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;
       border:0;background:none;padding:0;border-radius:0;
       transform:scaleY(0);transform-origin:bottom;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
  .bar.grown{transform:scaleY(1)}
  .bar span{display:block;background:var(--c)}
  .bar:hover span{filter:brightness(1.06)}
  .bar.sel{outline:2px solid var(--ink2);outline-offset:-2px}
  .xax{display:flex;gap:6px;padding-top:5px}
  .xax span{flex:1;text-align:center;font:11.5px var(--m);color:var(--ink3)}
  .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2)}
  .leg span{display:inline-flex;align-items:center;gap:6px}
  .leg i{width:10px;height:10px;background:var(--c);flex:none}
  .monthrow{background:var(--s1);padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;min-height:37px}
  .monthrow b{font-family:var(--m)}
  .monthrow .kk{color:var(--ink2)}
  .monthrow .kk i{display:inline-block;width:9px;height:9px;background:var(--c);margin-right:5px}

  /* ── агентные элементы ──────────────────────────── */
  .aghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .aghead .who{font-size:12px;font-weight:700;color:var(--agent);text-transform:uppercase;letter-spacing:.03em}
  .aghead .st{font-size:13px;color:var(--ink2)}

  .drop{display:block;width:100%;padding:30px 20px;text-align:center;background:var(--s1);
        border:1px dashed var(--line);color:var(--ink2)}
  .drop:hover{background:var(--s2)}
  .drop b{display:block;font-size:15px;color:var(--ink)}
  .drop small{display:block;margin-top:3px;font-size:12.5px;color:var(--ink3)}
  .steps{display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
  .steps b{font-family:var(--m);color:var(--ink3);font-weight:400;margin-right:6px}

  .runlog{background:var(--s1);padding:10px 13px;display:flex;flex-direction:column;gap:3px;max-width:820px}
  .runlog .l{font:12.5px var(--m);color:var(--ink2)}
  .runlog .l.warn{color:var(--warn)}
  .runlog .l.ok{color:var(--ok)}

  .chat{max-width:820px;display:flex;flex-direction:column;gap:8px}
  .chatlog{background:var(--s1);padding:10px 13px;display:flex;flex-direction:column;gap:7px;max-height:240px;overflow:auto}
  .msg{font-size:13.5px;line-height:1.45}
  .msg.me{color:var(--ink);font-weight:600}
  .msg.me:before{content:"Вы: ";color:var(--ink3);font-weight:400}
  .msg.ai{color:var(--ink2);white-space:pre-line}
  .msg.ai:before{content:"Агент: ";color:var(--agent);font-weight:600}
  .chatrow{display:flex;gap:8px;flex-wrap:wrap}
  .chatrow input{font:inherit;font-size:13.5px;flex:1 1 340px;min-width:0;padding:8px 11px;
                 border:1px solid var(--line);background:var(--s0);color:var(--ink);border-radius:2px}
  .chatrow input:focus-visible{outline:2px solid var(--acc);outline-offset:0}
  .chatrow .send{font-size:13.5px;font-weight:600;padding:9px 15px;border:1px solid var(--acc2);
                 background:var(--acc);color:#FFF}
  .hints{display:flex;gap:8px;flex-wrap:wrap}
  .hints button{font:12.5px var(--m);padding:4px 9px;border:1px solid var(--line);background:var(--s0);color:var(--ink2)}
  .hints button:hover{border-color:var(--acc);color:var(--acc)}
  .offline{background:#FBF3E2;padding:9px 13px;font-size:13px;color:var(--ink2);max-width:820px}

  .qbox{max-width:680px;background:var(--s1);padding:0}
  .qbox .src{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
  .qbox .src .raw{display:inline-block;margin-top:5px;font:13px var(--m);background:#FFF7DC;
                  border:1px solid #D8AE1F;padding:2px 8px}
  .qbox .qb{padding:11px 14px;display:flex;flex-direction:column;gap:7px}
  .qbox .fld{font-size:12.5px;color:var(--ink3)}
  .qbox .got{font-size:14.5px;font-weight:700}
  .qbox .why{font-size:13px;color:var(--ink2);max-width:70ch}
  .qbox .btns{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 13px}
  .abtn{font-size:13.5px;font-weight:600;padding:9px 15px;border:1px solid var(--acc2);
        background:var(--acc);color:#FFF;text-align:left}
  .abtn:hover{background:var(--acc2)}
  .abtn small{display:block;font-size:11px;font-weight:400;opacity:.85}
  .abtn.alt{background:var(--s0);color:var(--ink2);border-color:var(--line)}
  .abtn.alt:hover{border-color:var(--acc);color:var(--acc)}
  .qnum{font-size:12px;font-weight:600;color:var(--warn)}

  .okrow{max-width:680px;background:#EDF5F0;padding:11px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .okrow .t{font-size:14px;font-weight:700;color:var(--ok)}
  .okrow .s{font-size:12.5px;color:var(--ink2)}
  .okrow button{margin-left:auto;font-size:13.5px;font-weight:600;padding:8px 16px;
                border:1px solid var(--acc2);background:var(--acc);color:#FFF}

  details.jr{border:1px solid var(--line2);background:var(--s1)}
  details.jr>summary{cursor:pointer;padding:8px 13px;font-size:13px;color:var(--ink2);list-style:none}
  details.jr>summary::-webkit-details-marker{display:none}
  details.jr>summary::before{content:"+";font-family:var(--m);margin-right:8px;color:var(--ink3)}
  details.jr[open]>summary::before{content:"−"}
  details.jr .in{padding:0 10px 10px}

  .agrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .agrow input{font:inherit;font-size:13.5px;flex:1 1 320px;min-width:0;padding:8px 11px;
               border:1px solid var(--line);background:var(--s0);color:var(--ink);border-radius:2px}
  .agrow input:focus-visible{outline:2px solid var(--acc);outline-offset:0}
  .agrow .go{font-size:13.5px;font-weight:600;padding:9px 15px;border:1px solid var(--acc2);background:var(--acc);color:#FFF}
  .exlist{display:flex;gap:8px;flex-wrap:wrap}
  .exlist button{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);background:var(--s0);color:var(--ink2)}
  .exlist button:hover{border-color:var(--acc);color:var(--acc)}
  .exlist button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc2);font-weight:600}

  .params{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
  .params>div{background:var(--s0);padding:7px 11px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .params .pn{color:var(--ink2)}
  .params .pv{font-family:var(--m);font-weight:600;white-space:nowrap}
  .params>div.hot{background:var(--accbg)}
  .params>div.hot .pv{color:var(--acc2)}

  .infe{max-width:760px;background:var(--badbg);padding:13px 16px;display:flex;flex-direction:column;gap:9px}
  .infe h3{margin:0;font-size:15px;font-weight:700;color:var(--bad)}
  .infe .clause{background:var(--s0);padding:9px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
  .infe .clause div b{font-family:var(--m);font-size:12.5px;margin-right:8px}
  .fixes{display:flex;flex-direction:column;gap:6px;max-width:760px}
  .fixb{text-align:left;font-size:13.5px;font-weight:600;padding:9px 13px;
        border:1px solid var(--line);background:var(--s0);color:var(--ink)}
  .fixb small{display:block;font-size:12px;font-weight:400;color:var(--ink3)}
  .fixb:hover{border-color:var(--acc);}
  .fixb.on{border-color:var(--ok);background:#EDF5F0}

  .memo{max-width:820px;background:var(--s1);padding:14px 17px;display:flex;flex-direction:column;gap:10px}
  .memo h3{margin:0;font-size:14.5px;font-weight:700}
  .memo ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
  .memo li{font-size:13.5px;color:var(--ink2)}
  .memo li b{font-family:var(--m);color:var(--ink)}
  .memo .qt{background:var(--s0);padding:10px 13px;font-size:13.5px;color:var(--ink2);font-style:italic;max-width:76ch}
  .memo .cp{align-self:flex-start;font-size:13px;font-weight:600;padding:7px 13px;
            border:1px solid var(--acc);background:var(--s0);color:var(--acc)}
  .memo .cp:hover{background:var(--accbg)}

  .solveline{display:none;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2)}
  .solveline.on{display:flex}
  .solveline .dotp{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:pulse 1s infinite alternate}
  @keyframes pulse{from{opacity:.35}to{opacity:1}}

  .delta-dn{color:var(--ok);font-weight:600}
  .delta-up{color:var(--bad);font-weight:600}
  .delta-z{color:var(--ink3)}

  @media (max-width:1060px){
    .frame{grid-template-columns:1fr}
    .nav{display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:4px 6px}
    .nav .g{width:100%;padding:8px 8px 2px}
    .nv{width:auto;padding:6px 10px}
    .split{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div class="wrap"><div class="app">

  <div class="top">
    <div class="logo"><b>Планирование ФОТ</b><span>CML, демонстрационный стенд</span></div>
    <div class="solveline" id="solveline"><span class="dotp"></span><span id="solvemsg">Решатель работает…</span></div>
    <span class="sp"></span>
    <span class="srcnote" id="srcnote"></span>
    <button class="runbtn" id="run" type="button">Рассчитать план</button>
  </div>

  <div class="frame">
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="main">
      <div class="head"><h1 id="h1"></h1><p id="hp"></p></div>
      <div class="body" id="bd"></div>
    </div>
  </div>

  <div class="status">
    <span class="st" id="stmain">Расчёт не выполнялся</span>
    <span id="stextra"></span>
    <span class="sp"></span>
    <span id="stscale"></span>
    <span>HiGHS, MIP</span>
  </div>

</div></div>

  rec:{t:"2 человека",s:"по делению итога строки"},

function questReady(q){
  if(!q.needDoc) return true;
  if(!DOCS) return false;
  return !DOCS.some(function(d){return d.ctr===q.needDoc&&d.st==="unk";})&&
         !DOCS.some(function(d){return d.bad&&d.st==="unk";});
}

var DOCS=null, pstate="empty", fieldsDone=0, askLeft=0, ptimer=null;
var LIVE=null;          /* результат реального разбора загруженного файла */
var CHAT=[];            /* переписка с агентом */
var srvOK=null;         /* доступен ли локальный сервер */

function makeDocs(){
  DOCS=D.contracts.map(function(c){
    var g = c.goz==="да";
    return {name:(g?"РКМ ":"Структура цены ")+c.num+".xlsx",
            form:g?"формы 9д, 22д, 23":"структура цены и расшифровка ФОТ",
            ctr:c.code, f:FIELDS_PER_CTR, st:"wait", bad:false};
  });
  DOCS.push({name:"Штатное расписание 2026.xlsx", form:"перечень штатных строк",
             ctr:"—", f:D.employees.length*FIELDS_EMP, st:"wait", bad:false});
  DOCS[D.contracts.length-1].bad=true;
}
function startParse(){
  if(pstate==="running")return;
  makeDocs(); pstate="running"; fieldsDone=0; askLeft=0;
  QUEST.forEach(function(q){q.res=null;});
  var i=0;
  function step(){
    if(i>=DOCS.length){
      pstate="done";
      askLeft=QUEST.filter(function(x){return !x.res;}).length;
      render(); return;
    }
    var d=DOCS[i];
    if(d.bad){d.st="unk";} else {d.st="ok"; fieldsDone+=d.f;}
    i++; render();
    ptimer=setTimeout(step,130);
  }
  render(); ptimer=setTimeout(step,350);
}
function docTable(){
  var rows=DOCS.map(function(d,di){
    var st;
    if(d.st==="wait") st='<span class="tMUTE">в очереди</span>';
    else if(d.st==="ok") st='<span class="tOK">обработан</span>';
    else st='<span class="tWARN">форма не распознана</span> '+
            '<button type="button" class="fixtype exlist-b" data-i="'+di+'" '+
            'style="font-size:12px;padding:3px 8px;border:1px solid var(--warn);background:var(--s0);color:var(--warn)">Указать: структура цены</button>';
    return [{v:d.name,cls:"mono"},
            d.st==="unk"?{v:"устаревший макет",cls:"tMUTE"}:(d.st==="wait"?{v:"",cls:""}:d.form),
            {v:d.st==="ok"?d.ctr:"",cls:"mono"},
            {v:d.st==="ok"?d.f:"",cls:"n"},{v:st}];
  });
  return tbl(["файл","распознанная форма","договор","полей","состояние"],rows);
}
function fileRow(f){
  var fd=new FormData(); fd.append("file",f);
  pstate="uploading"; render();
  fetch("/api/upload",{method:"POST",body:fd})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      srvOK=true;
      if(!j.ok){ LIVE={error:j.error,file:f.name}; pstate="live"; render(); return; }
      LIVE=j; pstate="live";
      CHAT=[{who:"ai",text:"Разобрал файл «"+j.file+"». "+
        (j.ready.ok
          ? "Данных достаточно для расчёта: сотрудников "+j.passport.employees.length+
            ", договоров "+j.passport.contracts.length+
            ". Можно править значения или запускать расчёт."
          : "Для расчёта не хватает: "+j.ready.missing.join(", ")+". "+(j.ready.hint||""))}];
      render();
    })
    .catch(function(){
      srvOK=false;
      LIVE={file:f.name, offline:true, log:[
        "Локальный сервер не запущен — файл не читался",
        "Показан паспорт демонстрационного файла demo_input.xlsx"],
        questions:[], ready:{ok:true,missing:[]},
        passport:{employees:D.employees.map(function(e){
            return {code:e.code,fio:e.fio,pos:e.pos,rate:e.rate,sal:e.sal};}),
          contracts:D.contracts.map(function(c){
            var k=[]; KINDS.forEach(function(K){ if(c.kinds&&c.kinds[K.id]==="да") k.push(K.n); });
            return {code:c.code,name:c.name,goz:c.goz,fot:c.fot,kinds:k};})}};
      pstate="live";
      CHAT=[{who:"ai",text:"Локальный сервер не запущен, поэтому файл не читался. "+
        "Показан паспорт демонстрационного файла: сотрудников "+D.employees.length+
        ", договоров "+D.contracts.length+". Правки в чате доступны при запущенном сервере."}];
      render();
    });
}

/* ═══════════ таблицы ═══════════ */
function tbl(head,rows,opts){
  var h='<div class="scr"><table><thead><tr>';
  head.forEach(function(c){h+="<th>"+c+"</th>";});
  h+="</tr></thead><tbody>";
  rows.forEach(function(r,i){
    var cls=(opts&&opts.sel===i?"sel ":"")+(opts&&opts.total===i?"total":"");
    h+="<tr"+(opts&&opts.key?' data-k="'+i+'"':"")+(cls?' class="'+cls.trim()+'"':"")+">";
    r.forEach(function(c){
      h+=(typeof c==="object")?'<td class="'+(c.cls||"")+'">'+c.v+"</td>":"<td>"+c+"</td>";
    });
    h+="</tr>";
  });
  return h+"</tbody></table></div>";
}

              .map(function(k){return k.n;}).join(", ")||"—";
}
function vCtr(){

/* ═══════════ штатное расписание ═══════════ */
function vEmp(){
  var rows=D.employees.map(function(e){
    var paid=solved?(A.byEmp[e.code]?A.byEmp[e.code].total:0):null;
    var needE=e.sal*empMonths(e);
    return [{v:e.code,cls:"mono"},e.fio,e.pos,
            {v:String(e.rate).replace(".",","),cls:"n"},
            {v:mo(e.sal),cls:"n"},
            {v:paid===null?"":mo(paid),cls:"n"},
            {v:paid===null?"":(Math.abs(paid-needE)<1?"полностью":"частично"),
             cls:paid===null?"":(Math.abs(paid-needE)<1?"tOK":"tWARN")}];
  });
  return '<div class="split"><div>'+
    tbl(["код","ФИО","должность","ставка","зарплата в месяц, ₽","выплачено за год, ₽","закрытие"],rows,{key:1,sel:selE})+
    '</div><div class="side" id="side"></div></div>';
}
function sideEmp(){
  if(selE<0) return '<div class="note">Выберите сотрудника в таблице</div>';
  var e=D.employees[selE];
  var h="<h3>"+e.code+", "+e.fio+"</h3>"+
    '<dl class="kv"><dt>должность</dt><dd class="txt">'+e.pos+"</dd>"+
    "<dt>подразделение</dt><dd class=\"txt\">"+e.dep+"</dd>"+
    "<dt>ставка</dt><dd>"+String(e.rate).replace(".",",")+"</dd>"+
    "<dt>зарплата в месяц</dt><dd>"+mo(e.sal)+" ₽</dd>"+
    "<dt>дата приёма</dt><dd>"+e["from"]+"</dd>"+
    (empMonths(e)<12?"<dt>в 2026 году</dt><dd>"+empMonths(e)+" мес.</dd>":"")+"</dl>";
  if(!solved) return h+'<div class="note">Распределение по договорам и видам выплат определяется расчётом</div>';
  var rowsMap={};
  (A.byEmp[e.code]?A.byEmp[e.code].rows:[]).forEach(function(p){
    var key=p.ctr+"|"+p.kind;
    rowsMap[key]=(rowsMap[key]||0)+p.sum;
  });
  var keys=Object.keys(rowsMap).sort();
  h+='<div class="cap">Выплаты за год по плану</div>'+
     '<table style="font-size:12.5px"><thead><tr><th>договор</th><th>вид</th><th class="n">сумма, ₽</th></tr></thead><tbody>'+
     keys.map(function(k){
       var p=k.split("|");
       return "<tr><td class=\"mono\">"+p[0]+"</td><td>"+(KN[p[1]]?KN[p[1]].n:p[1])+
              '</td><td class="n">'+mo(rowsMap[k])+"</td></tr>";
     }).join("")+
     '<tr class="total"><td></td><td>итого</td><td class="n">'+mo(A.byEmp[e.code].total)+"</td></tr>"+
     "</tbody></table>";
  return h;
}

    '<div class="plain">Плановые суммы взяты из текущего расчёта. Три расхождения '+

    "не отражённый в плане. Обе позиции подлежат внесению в штатное расписание до пересчёта остатка года.</div></div>";

/* ═══════════ обработчики ═══════════ */
function wire(){
  var dz=$("dropzone"), fp=$("filepick");
  if(dz){
    dz.addEventListener("click",function(){ if(fp) fp.click(); else startParse(); });
    dz.addEventListener("dragover",function(e){e.preventDefault();});
    dz.addEventListener("drop",function(e){
      e.preventDefault();
      var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) fileRow(f); else startParse();
    });
  }
  if(fp) fp.addEventListener("change",function(){
    if(fp.files&&fp.files[0]) fileRow(fp.files[0]);
  });
  var cs=$("chatsend");
  if(cs){
    var send=function(){
      var q=$("chatq").value.trim();
      if(!q) return;
      CHAT.push({who:"me",text:q});
      $("chatq").value="";
      fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
                         body:JSON.stringify({text:q})})
        .then(function(r){return r.json();})
        .then(function(j){
          CHAT.push({who:"ai",text:j.reply||"нет ответа"});
          if(j.passport) LIVE.passport=j.passport;
          render();
          if(j.solve) doSolve();
        })
        .catch(function(){
          CHAT.push({who:"ai",text:"Локальный сервер недоступен — правки не применяются"});
          render();
        });
    };
    cs.addEventListener("click",send);
    $("chatq").addEventListener("keydown",function(e){ if(e.key==="Enter") send(); });
    [].forEach.call(document.querySelectorAll(".hints .ch"),function(b){
      b.addEventListener("click",function(){ $("chatq").value=b.getAttribute("data-t"); send(); });
    });
  }
  [].forEach.call(document.querySelectorAll(".liveq"),function(b){
    b.addEventListener("click",function(){
      CHAT.push({who:"me",text:b.textContent});
      CHAT.push({who:"ai",text:"Принято: "+b.textContent+". Значение зафиксировано в паспорте."});
      render();
    });
  });
  var fd=$("factdrop");
  if(fd){
    fd.addEventListener("click",function(){factLoaded=true;render();});
    fd.addEventListener("dragover",function(e){e.preventDefault();});
    fd.addEventListener("drop",function(e){e.preventDefault();factLoaded=true;render();});
  }
  [].forEach.call(document.querySelectorAll(".fixtype"),function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      var d=DOCS[+b.getAttribute("data-i")];
      d.st="ok"; d.form="структура цены (устаревший макет)"; fieldsDone+=d.f;
      render();
    });
  });
  [].forEach.call(document.querySelectorAll(".qbtn"),function(b){
    b.addEventListener("click",function(){
      QUEST[+b.getAttribute("data-q")].res=b.getAttribute("data-v");
      askLeft=QUEST.filter(function(x){return !x.res;}).length;
      render();
    });
  });
  var gp=$("goplan");
  if(gp) gp.addEventListener("click",function(){
    if(!solved) doSolve(); else {sec="plan";render();}
  });
  [].forEach.call(document.querySelectorAll("tr[data-k]"),function(tr){
    tr.addEventListener("click",function(){
      var i=+tr.getAttribute("data-k");
      if(sec==="ctr") selC=i; else if(sec==="emp") selE=i;
      render();
    });
  });
  [].forEach.call(document.querySelectorAll(".bar"),function(b){
    b.addEventListener("click",function(){selM=+b.getAttribute("data-m");render();});
  });
  [].forEach.call(document.querySelectorAll(".wsc"),function(b){
    b.addEventListener("click",function(){
      scenSel=+b.getAttribute("data-i"); scenLive=null; scenMsg=""; render();
    });
  });
  var sg=$("scgo");
  if(sg){
    var runScen=function(){
      var q=$("scq").value.trim();
      if(!q||scenBusy) return;
      scenBusy=true; scenMsg=""; scenLive=null; render();
      fetch("/api/scenario",{method:"POST",headers:{"Content-Type":"application/json"},
                             body:JSON.stringify({text:q})})
        .then(function(r){return r.json();})
        .then(function(j){
          scenBusy=false;
          if(!j.ok){ scenMsg=j.error+". "+(j.hint||""); }
          else { scenLive=j; }
          render();
        })
        .catch(function(){
          scenBusy=false;
          scenMsg="Локальный сервер не запущен: пересчёт по произвольному требованию "+
                  "недоступен, показаны заранее просчитанные сценарии.";
          render();
        });
    };
    sg.addEventListener("click",runScen);
    $("scq").addEventListener("keydown",function(e){ if(e.key==="Enter") runScen(); });
  }
  [].forEach.call(document.querySelectorAll(".fixb"),function(b){
    b.addEventListener("click",function(){diagFix=+b.getAttribute("data-f");render();});
  });
  [].forEach.call(document.querySelectorAll(".calex"),function(b){
    b.addEventListener("click",function(){applyPreset(+b.getAttribute("data-i"),PRESETS[+b.getAttribute("data-i")].name);});
  });
  var cg=$("calgo");
  if(cg){
    var go=function(){
      var q=$("calq").value||"", hit=-1;
      PRESETS.forEach(function(p,i){if(hit<0&&p.re.test(q))hit=i;});
      if(hit>=0) applyPreset(hit,q);
      else {
        hotKeys={}; calMsg="Требование не сопоставлено с демонстрационным набором — готовые примеры показаны над полем ввода. Параметры оставлены без изменений.";
        render();
      }
    };
    cg.addEventListener("click",go);
    $("calq").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
  }
  var cp=$("cpbtn");
  if(cp) cp.addEventListener("click",function(){
    var t=cp.parentNode.querySelector(".qt").textContent.trim();
    var done=function(){cp.textContent="Текст скопирован";setTimeout(function(){cp.textContent="Скопировать текст";},1800);};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,done);
    else done();
  });
}
function applyPreset(i,label){
  var p=PRESETS[i];
  hotKeys={};
  SETTINGS.forEach(function(s){curSet[s[0]]=s[1];});
  Object.keys(p.set).forEach(function(k){curSet[k]=p.set[k];hotKeys[k]=1;});
  calMsg="Разобрано требование: «"+label+"». Изменённые параметры выделены.";
  [].forEach.call(document.querySelectorAll(".calex"),function(b,bi){
    b.classList.toggle("on",bi===i);
  });
  render();
  [].forEach.call(document.querySelectorAll(".calex"),function(b,bi){
    b.classList.toggle("on",bi===i);
  });
}

/* ═══════════ расчёт: настоящий API либо встроенный результат ═══════════ */
var solveTimer=null;
function doSolve(){
  var b=$("run");
  b.disabled=true; b.textContent="Расчёт…";
  $("solveline").classList.add("on");
  var t0=Date.now();
  solveTimer=setInterval(function(){
    $("solvemsg").textContent="Решатель работает, "+Math.round((Date.now()-t0)/1000)+" с";
  },500);

  function finish(source,secVal,data){
    clearInterval(solveTimer);
    $("solveline").classList.remove("on");
    if(data){ D=data; A=agg(D.plan);
      NEED=D.employees.reduce(function(a,e){return a+e.sal*empMonths(e);},0);
      TFOT=D.contracts.reduce(function(a,c){return a+c.fot;},0); }
    solved=true; liveSource=source; liveSec=secVal;
    b.disabled=false; b.textContent="Пересчитать";
    $("stmain").textContent="Статус: "+String(summaryVal("Статус решателя"));
    $("stmain").className="st ok";
    $("stextra").textContent=source==="api"
      ? "рассчитано решателем только что, "+fmtSec(secVal)+" с"
      : "встроенный результат расчёта, "+fmtSec(META.solve_sec)+" с";
    $("srcnote").textContent=source==="api"?"локальный решатель подключён":"";
    sec="plan"; render();
  }

  var ctrl=new AbortController();
  var kill=setTimeout(function(){ctrl.abort();},1200000);
  fetch("/api/solve",{method:"POST",signal:ctrl.signal,
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({settings:curSet})})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){
      clearTimeout(kill);
      if(j.ok) finish("api",j.sec,j.data);
      else finish("embedded",null,null);
    })
    .catch(function(){
      clearTimeout(kill);
      setTimeout(function(){finish("embedded",null,null);},900);
    });
}
$("run").addEventListener("click",doSolve);

render();
})();
</script>
</body>
</html>
