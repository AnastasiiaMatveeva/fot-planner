[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fot-planner"
version = "0.1.0"
description = "Планирование ФОТ сотрудников по договорам НИОКР"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyomo>=6.8",
    "highspy>=1.8",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fot-planner = "fot_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Все тесты сейчас пропускаются в tests/conftest.py (TESTS_DISABLED = True).
