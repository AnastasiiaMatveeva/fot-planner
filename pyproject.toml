[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fot-planner"
version = "0.1.0"
description = "Планирование ФОТ сотрудников по договорам НИОКР"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyomo>=6.8",
    "highspy>=1.8",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# разбор нормативных документов моделью (app/llm.py);
# без этого пакета документы разбираются по заголовкам
llm = ["anthropic>=1.0", "certifi>=2024.0"]
# веб-приложение: лента дела, хранение прогонов и документов
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
       "python-multipart>=0.0.9",
       # чтение нормативных документов: PDF и старый бинарный .doc
       "pypdf>=4.0", "olefile>=0.47",
       # Сканы: страницы рисуются картинками и читаются моделью.
       "pypdfium2>=4.30", "pillow>=10.0",
       # предпросмотр «как есть»: печать Word и книги в PDF установленным
       # Office; без пакета остаётся LibreOffice, без обоих — только разбор
       "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
fot-planner = "fot_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Все тесты сейчас пропускаются в tests/conftest.py (TESTS_DISABLED = True).
